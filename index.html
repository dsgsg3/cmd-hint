<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运维命令速查</title>
  <script>
    (function () {
      var theme = null;
      try { theme = JSON.parse(localStorage.getItem('opscmd.theme')); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">$</div>
      <div class="brand-text">
        <h1>运维命令速查</h1>
        <p>记不住没关系，搜你记得的那几个字</p>
      </div>
    </div>
    <nav class="top-actions">
      <button class="ghost-btn" id="btn-history" type="button">最近</button>
      <button class="ghost-btn" id="btn-add" type="button">+ 添加</button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
    </nav>
  </header>

  <main class="wrap">
    <section class="search-area">
      <div class="search-box" role="search">
        <span class="prompt">$</span>
        <input id="search" type="search" placeholder="描述或命令片段，例如：端口占用、docker 日志、磁盘满" autocomplete="off" spellcheck="false" aria-label="搜索命令">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="分类"></div>
      <div class="meta-line">
        <span id="count"></span>
        <span class="keys">↑ ↓ 选择 · Enter 复制 · Esc 清空</span>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>数据只保存在本机 · 共 <span id="total-count">0</span> 条命令</span>
      <div class="foot-actions">
        <button class="link-btn" id="btn-export" type="button">导出备份</button>
        <button class="link-btn" id="btn-import" type="button">导入备份</button>
        <input id="file-import" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </footer>

  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
